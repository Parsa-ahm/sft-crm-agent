description = "LoRA SFT of Qwen2.5-1.5B: parts-broker inbox message -> CRM record + rule-checked draft reply"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "transformers==5.18.0",
    "safetensors==0.8.0",
